# Konfigurasi Netlify untuk Next.js (App Router, Server Actions).
# Situs ini tidak memakai database atau variabel environment apa pun.
# Jangan memakai `output: "export"`; publish directory harus `.next` dan Netlify Next.js Runtime yang menjalankannya.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 membutuhkan Node.js 20.9 atau lebih baru.
  NODE_VERSION = "22"
