# Konfigurasi Netlify untuk Next.js (App Router, Server Actions, login username + SQLite).
# Aplikasi ini memakai server-side rendering dan cookie sesi, jadi JANGAN memakai `output: "export"`.
# Publish directory harus `.next` (bukan root repo), dan Netlify Next.js Runtime yang menjalankannya.
#
# Database: SQLite lewat libSQL/Turso. Isi DATABASE_URL dan DATABASE_AUTH_TOKEN di
# Site configuration -> Environment variables (scope Builds + Runtime).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 membutuhkan Node.js 20.9 atau lebih baru.
  NODE_VERSION = "22"
